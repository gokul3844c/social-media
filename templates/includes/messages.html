{% if messages %}
<div class="messages-container" id="system-messages">
  {% for message in messages %}
  <div class="alert-toast alert-{{ message.tags|default:'info' }}" role="alert">
    <div class="alert-content">
      <span class="alert-icon">
        {% if message.tags == 'error' or message.tags == 'danger' %}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {% elif message.tags == 'success' %}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        {% else %}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        {% endif %}
      </span>
      <span class="alert-message">{{ message }}</span>
    </div>
    <button type="button" class="alert-close-btn" onclick="this.closest('.alert-toast').remove()" aria-label="Close notification">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
