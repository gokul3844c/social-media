{% load static %}
<aside class="sidebar-left" aria-label="Main Sidebar Navigation">
  <div class="sidebar-inner">
    <!-- Brand Logo -->
    <a href="{% url 'home' %}" class="brand-link" title="SocialSphere Home">
      <div class="brand-logo-wrapper">
        <img src="{% static 'images/logo.svg' %}" alt="SocialSphere" class="brand-icon">
      </div>
      <span class="brand-text">SocialSphere</span>
    </a>

    <!-- Nav Menu -->
    <nav class="sidebar-nav">
      <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </span>
        <span class="nav-label">Home</span>
      </a>

      <a href="{% url 'search' %}" class="nav-item {% if request.resolver_match.url_name == 'search' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <span class="nav-label">Search</span>
      </a>

      {% if user.is_authenticated %}
      <a href="{% url 'notifications' %}" class="nav-item {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          </svg>
        </span>
        <span class="nav-label">Notifications</span>
      </a>

      <button type="button" class="nav-item open-create-modal-btn create-action-item">
        <span class="nav-icon create-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </span>
        <span class="nav-label">Create</span>
      </button>

      <a href="{% url 'profile' user.username %}" class="nav-item {% if request.resolver_match.url_name == 'profile' and request.resolver_match.kwargs.username == user.username %}active{% endif %}">
        <span class="nav-icon avatar-nav-icon">
          <img src="{{ user.profile.avatar_url }}" alt="{{ user.username }}" class="nav-avatar-mini">
        </span>
        <span class="nav-label">Profile</span>
      </a>
      {% endif %}
    </nav>

    <!-- Sidebar Bottom Profile / Auth controls -->
    <div class="sidebar-bottom">
      {% if user.is_authenticated %}
      <div class="user-profile-widget">
        <a href="{% url 'profile' user.username %}" class="user-widget-link">
          <img src="{{ user.profile.avatar_url }}" alt="{{ user.username }}" class="user-widget-avatar">
          <div class="user-widget-info">
            <span class="user-widget-username">@{{ user.username }}</span>
            <span class="user-widget-name">{{ user.profile.display_name }}</span>
          </div>
        </a>
        <form action="{% url 'logout' %}" method="POST" class="logout-inline-form">
          {% csrf_token %}
          <button type="submit" class="logout-btn" title="Log out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </form>
      </div>
      {% else %}
      <div class="auth-buttons-widget">
        <a href="{% url 'login' %}" class="btn btn-secondary btn-block">Sign In</a>
        <a href="{% url 'register' %}" class="btn btn-gradient btn-block">Sign Up</a>
      </div>
      {% endif %}
    </div>
  </div>
</aside>
